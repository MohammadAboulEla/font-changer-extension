<!DOCTYPE html>
<html>
<head>
    <title>Font Changer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; padding: 12px; width: 280px; font-size: 13px; color: #333; }
        .domain { font-size: 13px; font-weight: 600; margin-bottom: 10px; color: #555; }
        .mode-row { margin-bottom: 8px; }
        .mode-row select { width: 100%; padding: 4px 6px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; }
        .well { border: 1px solid #ddd; border-radius: 6px; padding: 10px; margin-top: 8px; background: #fafafa; }
        .setting-name { font-size: 15px; font-weight: 700; color: #888; margin-bottom: 10px; }
        .control-group { margin-bottom: 8px; }
        .control-group label { display: block; font-weight: 600; margin-bottom: 3px; font-size: 12px; color: #666; }
        .row { display: flex; align-items: center; gap: 6px; }
        .row input[type="checkbox"] { flex-shrink: 0; }
        .row select, .row input[type="text"] { flex: 1; padding: 4px 6px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; }
        .row select:disabled, .row input:disabled { opacity: 0.5; background: #eee; }
        .done-cont { margin-top: 12px; text-align: center; }
        .done-cont button { background: #4285f4; color: #fff; border: none; padding: 7px 28px; border-radius: 4px; font-size: 13px; cursor: pointer; }
        .done-cont button:hover { background: #3367d6; }
    </style>
</head>
<body>
    <div class="domain"></div>
    <div class="mode-row">
        Use <select class="setting-type">
            <option value="global">Global Font</option>
            <option value="custom">Site Specific Font</option>
            <option value="none">No Font</option>
        </select>
    </div>
    <div class="well">
        <div class="setting-name">Global Font</div>

        <div class="control-group">
            <label>Font Name</label>
            <div class="row">
                <input type="checkbox" id="font_family_chk">
                <select id="font_family" disabled></select>
            </div>
        </div>

        <div class="control-group">
            <label>Font Weight</label>
            <div class="row">
                <input type="checkbox" id="font_weight_chk">
                <select id="font_weight" disabled>
                    <option value="normal">Normal</option>
                    <option value="bold">Bold</option>
                    <option value="bolder">Bolder</option>
                    <option value="lighter">Lighter</option>
                </select>
            </div>
        </div>

        <div class="control-group">
            <label>Font Size</label>
            <div class="row">
                <input type="checkbox" id="font_size_chk">
                <input type="text" id="font_size" disabled placeholder="16"> <span>px</span>
            </div>
        </div>

        <div class="control-group">
            <label>Font Style</label>
            <div class="row">
                <input type="checkbox" id="font_style_chk">
                <select id="font_style" disabled>
                    <option value="normal">Normal</option>
                    <option value="italic">Italic</option>
                    <option value="oblique">Oblique</option>
                </select>
            </div>
        </div>
    </div>
    <div class="done-cont"><button class="done" type="button">Done</button></div>

    <script src="js/default.js"></script>
</body>
</html>
