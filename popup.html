<!DOCTYPE html>
<html>
<head>
    <title>Font Changer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; padding: 12px; width: 320px; font-size: 13px; color: #333; }
        .domain { font-size: 13px; font-weight: 600; margin-bottom: 10px; color: #555; }
        .mode-row { margin-bottom: 8px; }
        .mode-row select { width: 100%; padding: 4px 6px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; }
        .well { border: 1px solid #ddd; border-radius: 6px; padding: 10px; margin-top: 8px; background: #fafafa; }
        .setting-name { font-size: 15px; font-weight: 700; color: #888; margin-bottom: 10px; }
        .control-group { margin-bottom: 8px; }
        .control-group label { display: block; font-weight: 600; margin-bottom: 3px; font-size: 12px; color: #666; }
        .row { display: flex; align-items: center; gap: 6px; }
        .row input[type="checkbox"] { flex-shrink: 0; }
        .row select, .row input[type="text"], .row input[type="number"] { flex: 1; padding: 4px 6px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; }
        .row select:disabled, .row input:disabled { opacity: 0.5; background: #eee; }
        .done-cont { margin-top: 12px; text-align: center; }
        .done-cont button { background: #4285f4; color: #fff; border: none; padding: 7px 28px; border-radius: 4px; font-size: 13px; cursor: pointer; }
        .done-cont button:hover { background: #3367d6; }
        /* Element targeting styles */
        .target-section { display: none; margin-top: 10px; border-top: 1px solid #e0e0e0; padding-top: 10px; }
        .target-section.visible { display: block; }
        .preset-groups { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
        .preset-btn { padding: 3px 8px; font-size: 11px; border: 1px solid #ccc; border-radius: 12px; background: #fff; cursor: pointer; color: #555; transition: all 0.15s; }
        .preset-btn:hover { border-color: #4285f4; color: #4285f4; }
        .preset-btn.active { background: #4285f4; color: #fff; border-color: #4285f4; }
        .tag-pills { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; min-height: 20px; }
        .tag-pill { display: inline-flex; align-items: center; gap: 3px; padding: 2px 6px; font-size: 11px; background: #e8f0fe; color: #1a73e8; border-radius: 10px; font-family: monospace; }
        .tag-pill .remove-pill { cursor: pointer; font-size: 13px; line-height: 1; color: #1a73e8; opacity: 0.6; }
        .tag-pill .remove-pill:hover { opacity: 1; }
        .manual-add { display: flex; gap: 4px; margin-top: 4px; }
        .manual-add input { flex: 1; padding: 3px 6px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; font-family: monospace; }
        .manual-add button { padding: 3px 10px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; color: #555; }
        .manual-add button:hover { border-color: #4285f4; color: #4285f4; }
    </style>
</head>
<body>
    <div class="domain"></div>
    <div class="mode-row">
        Use <select class="setting-type">
            <option value="global">Global Font</option>
            <option value="custom">Site Specific Font</option>
            <option value="none">No Font</option>
        </select>
    </div>
    <div class="well">
        <div class="setting-name">Global Font</div>

        <div class="control-group">
            <label>Font Name</label>
            <div class="row">
                <input type="checkbox" id="font_family_chk">
                <select id="font_family" disabled></select>
            </div>
        </div>

        <div class="control-group">
            <label>Font Weight</label>
            <div class="row">
                <input type="checkbox" id="font_weight_chk">
                <input type="number" id="font_weight" disabled placeholder="400" min="100" max="900" step="100">
            </div>
        </div>

        <div class="control-group">
            <label>Font Size</label>
            <div class="row">
                <input type="checkbox" id="font_size_chk">
                <input type="text" id="font_size" disabled placeholder="16"> <span>px</span>
            </div>
        </div>

        <div class="control-group">
            <label>Font Scale</label>
            <div class="row">
                <input type="checkbox" id="font_scale_chk">
                <input type="number" id="font_scale" disabled placeholder="1.2" min="0.1" max="5" step="0.05"> <span>x</span>
            </div>
        </div>

        <div class="control-group">
            <label>Font Style</label>
            <div class="row">
                <input type="checkbox" id="font_style_chk">
                <select id="font_style" disabled>
                    <option value="normal">Normal</option>
                    <option value="italic">Italic</option>
                    <option value="oblique">Oblique</option>
                </select>
            </div>
        </div>

        <div class="control-group">
            <label>Apply To</label>
            <div class="row">
                <select id="target_mode">
                    <option value="all">All Elements</option>
                    <option value="include">Include Only</option>
                    <option value="exclude">Exclude</option>
                </select>
            </div>
        </div>

        <div class="control-group">
            <div class="row" style="gap:6px;align-items:center;">
                <input type="checkbox" id="exclude_icon_fonts" checked>
                <label for="exclude_icon_fonts" style="margin:0;cursor:pointer;">Exclude Icon Fonts</label>
            </div>
            <div style="font-size:11px;color:#999;margin-top:2px;margin-left:20px;">Skip Material Symbols, Font Awesome, etc.</div>
        </div>

        <div class="target-section" id="target_section">
            <label style="font-weight:600;font-size:12px;color:#666;margin-bottom:4px;display:block;">Quick Groups</label>
            <div class="preset-groups">
                <button type="button" class="preset-btn" data-group="headings">Headings</button>
                <button type="button" class="preset-btn" data-group="body">Body Text</button>
                <button type="button" class="preset-btn" data-group="nav">Navigation</button>
                <button type="button" class="preset-btn" data-group="code">Code</button>
                <button type="button" class="preset-btn" data-group="forms">Forms</button>
            </div>
            <div class="tag-pills" id="tag_pills"></div>
            <div class="manual-add">
                <input type="text" id="manual_element" placeholder="e.g. article, .my-class">
                <button type="button" id="add_element">+ Add</button>
            </div>
        </div>
    </div>
    <div class="done-cont"><button class="done" type="button">Done</button></div>

    <script src="js/default.js"></script>
</body>
</html>
